<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Picks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 30%22%3E%3Crect width=%2220%22 height=%2230%22 rx=%222%22 fill=%22%232C6E8F%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <h1>Movie Picks</h1>
    <form id="who" class="who" autocomplete="off">
      <label for="name">Your name</label>
      <input id="name" name="name" maxlength="40" placeholder="e.g. priya" pattern="[A-Za-z0-9_\-]{1,40}"
             title="Letters, numbers, - or _ (no spaces)" required>
      <button type="submit">Start</button>
    </form>
  </header>

  <main class="layout">
    <section class="main-col">
      <div class="search">
        <label for="q" class="visually-hidden">Search movies</label>
        <input id="q" type="search" placeholder="Search a movie you've seen…" disabled>
      </div>
      <p id="status" class="status" role="status"></p>

      <section id="results-block" hidden>
        <h2>Search results</h2>
        <div id="results" class="shelf"></div>
      </section>

      <section id="similar-block" hidden>
        <div class="block-head">
          <h2 id="similar-title">More like this</h2>
          <button id="close-similar" class="link-btn" type="button">Close</button>
        </div>
        <div id="similar" class="shelf"></div>
      </section>

      <section>
        <h2 id="recs-title">Popular right now</h2>
        <p id="recs-hint" class="hint">Enter your name and rate a few movies. Your picks update after every rating.</p>
        <div id="recs" class="shelf grid"></div>
      </section>
    </section>

    <aside class="side-col">
      <h2>Your ratings</h2>
      <ol id="ratings" class="ratings"></ol>
      <p id="ratings-empty" class="hint">Nothing rated yet.</p>
    </aside>
  </main>

  <template id="tile">
    <article class="tile">
      <button class="poster" type="button">
        <span class="poster-title"></span>
        <span class="poster-year"></span>
      </button>
      <p class="reason"></p>
      <div class="stars" role="group"></div>
    </article>
  </template>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
